name = "circle_packing"
version = "1.3.0"
defaultTargets = ["CirclePacking"]

[leanOptions]
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

# computational core (core Lean only), compiled to native code for `native_decide`
[[lean_lib]]
name = "C15Compute"
precompileModules = true

# computational core (core Lean only), compiled to native code for `native_decide`
[[lean_lib]]
name = "C16Compute"
precompileModules = true

# the proofs; the root module `CirclePacking` imports everything
[[lean_lib]]
name = "CirclePacking"
